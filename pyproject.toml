[tool.poetry]
name = "supportflow"
version = "0.1.0"
description = "Auditable multi-agent RAG workflow for enterprise support operations"
authors = ["SupportFlow contributors"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
openai = "^2.53.0"
langgraph = "^0.2.19"
celery = {extras = ["redis"], version = "^5.4.0"}
python-dotenv = "^1.0.1"
psycopg = {extras = ["binary"], version = "^3.2.0"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
