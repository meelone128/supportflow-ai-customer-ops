[project]
name = "supportflow"
version = "0.1.0"
description = "Auditable multi-agent RAG workflow for enterprise support operations"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "openai==2.53.0",
  "langgraph==0.2.19",
  "celery[redis]==5.4.0",
  "python-dotenv==1.0.1",
  "psycopg[binary]>=3.2,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["supportflow*"]
